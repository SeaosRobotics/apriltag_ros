# # Definitions of tags to detect
#
# ## General remarks
#
# - All lengths in meters
# - The ROS 2 parameter system does not support arrays of structs the way
#   ROS 1's XmlRpc-backed parameters did, so standalone tags and tag bundles
#   are described with parallel arrays instead of a list of dictionaries.
#
# ## Standalone tag definitions
# ### Remarks
#
# - standalone_tags.names is optional; a missing/empty entry defaults to
#   "tag_<ID>"
# - standalone_tags.ids and standalone_tags.sizes must have the same length
#
# ### Syntax
#
# standalone_tags:
#   ids:   [ID, ID, ...]
#   sizes: [SIZE, SIZE, ...]
#   names: [NAME, NAME, ...]   # optional
#
# ## Tag bundle definitions
# ### Remarks
#
# - tag_bundles.names lists the bundle names; each name gets its own
#   "tag_bundles.<name>.*" sub-namespace of parallel arrays
# - x, y, z default to 0 and are optional
# - qw defaults to 1, qx/qy/qz default to 0, and are optional
#
# ### Syntax
#
# tag_bundles:
#   names: ['CUSTOM_BUNDLE_NAME', ...]
#   CUSTOM_BUNDLE_NAME:
#     ids:   [ID, ID, ...]
#     sizes: [SIZE, SIZE, ...]
#     x:     [X_POS, ...]   # optional
#     y:     [Y_POS, ...]   # optional
#     z:     [Z_POS, ...]   # optional
#     qw:    [QUAT_W_VAL, ...] # optional
#     qx:    [QUAT_X_VAL, ...] # optional
#     qy:    [QUAT_Y_VAL, ...] # optional
#     qz:    [QUAT_Z_VAL, ...] # optional
#
# Example (uncomment and edit):
#
# /**:
#   ros__parameters:
#     standalone_tags:
#       ids:   [0, 1]
#       sizes: [0.06, 0.06]
#       names: ['tag_0', 'tag_1']
#     tag_bundles:
#       names: ['my_bundle']
#       my_bundle:
#         ids:   [2, 3]
#         sizes: [0.06, 0.06]
#         x:     [0.0, 0.1]
#         y:     [0.0, 0.0]
#         z:     [0.0, 0.0]
#
# An empty YAML array's element type cannot be inferred by the ROS 2
# parameter parser, so no standalone tags/bundles are declared by default
# here -- the node falls back to its (also empty) in-code defaults instead.
